<nav class="fixed top-0 left-0 right-0 z-50 glass border-b border-white/[0.04]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-3 group">
        <div class="logo-badge">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
        </div>
        <div class="hidden sm:block">
          <span class="text-lg font-display font-bold text-white tracking-tight">MicroShop</span>
          <span class="block text-[10px] text-slate-500 font-medium tracking-[0.2em] uppercase -mt-0.5">Spring Microservices</span>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center gap-1">
        <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact:true}" class="nav-link">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
          </svg>
          Products
        </a>
        @if (isAuthenticated) {
          <a routerLink="/add-product" routerLinkActive="nav-active" class="nav-link">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            Add Product
          </a>
        }
      </div>

      <!-- Right Side -->
      <div class="flex items-center gap-3">
        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[11px] text-emerald-400 font-medium">Systems Online</span>
        </div>

        @if (isAuthenticated) {
          <div class="flex items-center gap-2.5">
            <div class="user-avatar">{{ (username ? username.charAt(0).toUpperCase() : 'U') }}</div>
            <span class="hidden sm:block text-sm text-slate-300 font-medium">{{ username }}</span>
          </div>
          <button (click)="logout()" class="btn-ghost text-xs">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
          </button>
        } @else {
          <button (click)="login()" class="btn-primary text-sm py-2 px-5">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            Sign In
          </button>
        }

        <!-- Mobile Toggle -->
        <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-slate-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu -->
    @if (mobileMenuOpen) {
      <div class="md:hidden border-t border-white/[0.04] py-3 animate-slide-in">
        <a routerLink="/" (click)="mobileMenuOpen=false" class="nav-link block py-2">Products</a>
        @if (isAuthenticated) {
          <a routerLink="/add-product" (click)="mobileMenuOpen=false" class="nav-link block py-2">Add Product</a>
        }
      </div>
    }
  </div>
</nav>
